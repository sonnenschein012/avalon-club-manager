name: Production Hosting

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: all
        options:
          - all
          - manager
          - exhibition
          - exhibition-admin
          - firestore-rules
      deploy:
        description: Publish to production (unchecked only builds and verifies access)
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  hosting:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-hosting
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT: gen-lang-client-0205444206
    steps:
      - name: Require a repository administrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for actor in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            if [[ -z "$actor" ]] || ! gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" \
              --jq '.permission' | grep -qx admin; then
              echo "::error::A repository administrator must start or retry the Production workflow."
              exit 1
            fi
          done

      - name: Select deployment targets
        id: plan
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            all|manager|exhibition|exhibition-admin|firestore-rules) ;;
            *) echo "::error::Unknown deployment target."; exit 1 ;;
          esac
          for variant in manager exhibition exhibition-admin firestore-rules; do
            if [[ "$TARGET" == all || "$TARGET" == "$variant" ]]; then
              echo "${variant//-/_}=true" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "Target: $TARGET (deploy=${{ inputs.deploy }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build manager
        if: steps.plan.outputs.manager == 'true'
        run: npm run build

      - name: Build exhibition
        if: steps.plan.outputs.exhibition == 'true'
        run: npm run exhibition:build

      - name: Build exhibition admin
        if: steps.plan.outputs.exhibition_admin == 'true'
        run: npm run exhibition:admin:build

      - name: Check WIF configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for mapping in WIF_PROVIDER:GCP_WORKLOAD_IDENTITY_PROVIDER SERVICE_ACCOUNT:GCP_SERVICE_ACCOUNT; do
            key=${mapping%%:*}
            name=${mapping#*:}
            if [[ -z "${!key}" ]]; then
              echo "::error::Production repository environment variable $name is missing."
              missing=1
            fi
          done
          (( missing == 0 )) || exit 1
          if [[ ! "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER must be the full provider resource name using the project number."
            exit 1
          fi
          if [[ ! "$SERVICE_ACCOUNT" =~ ^[^@[:space:]]+@[^@[:space:]]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::GCP_SERVICE_ACCOUNT must be a Google Cloud service account email."
            exit 1
          fi

      - name: Exchange GitHub OIDC token with Google STS
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ env.FIREBASE_PROJECT }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Impersonate deploy service account and configure ADC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.FIREBASE_PROJECT }}
          token_format: access_token

      - name: Verify Firebase CLI authentication
        run: npx --no-install firebase --version

      - name: Verify selected Hosting sites using Firebase CLI
        if: steps.plan.outputs.manager == 'true' || steps.plan.outputs.exhibition == 'true' || steps.plan.outputs.exhibition_admin == 'true'
        env:
          MANAGER: ${{ steps.plan.outputs.manager }}
          EXHIBITION: ${{ steps.plan.outputs.exhibition }}
          EXHIBITION_ADMIN: ${{ steps.plan.outputs.exhibition_admin }}
        run: |
          sites=()
          if [[ "$MANAGER" == true ]]; then sites+=(avalondgu); fi
          if [[ "$EXHIBITION" == true ]]; then sites+=(avalon-collection); fi
          if [[ "$EXHIBITION_ADMIN" == true ]]; then sites+=(avalon-collection-studio); fi
          result="$RUNNER_TEMP/firebase-hosting-sites.json"
          if ! npx --no-install firebase hosting:sites:list --project "$FIREBASE_PROJECT" --non-interactive --json > "$result"; then
            jq -r '.error // .message // empty' "$result"
            echo "::error::Firebase CLI site lookup failed after service-account authentication."
            exit 1
          fi
          for site in "${sites[@]}"; do
            if ! jq -e --arg site "$site" '
              .status == "success" and any(.result.sites[]; (.name | split("/") | last) == $site)
            ' "$result" >/dev/null; then
              echo "::error::Hosting site $site was not listed in $FIREBASE_PROJECT."
              exit 1
            fi
            echo "Firebase CLI verified site: $site"
          done

      - name: Verify permissions for the selected targets
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHECK_HOSTING: ${{ steps.plan.outputs.manager == 'true' || steps.plan.outputs.exhibition == 'true' || steps.plan.outputs.exhibition_admin == 'true' }}
          CHECK_RULES: ${{ steps.plan.outputs.firestore_rules }}
        run: |
          permissions=(firebase.projects.get)
          if [[ "$CHECK_HOSTING" == true ]]; then
            permissions+=(firebasehosting.sites.get firebasehosting.sites.list firebasehosting.sites.update)
          fi
          if [[ "$CHECK_RULES" == true ]]; then
            permissions+=(datastore.databases.get firebaserules.releases.create firebaserules.releases.list
              firebaserules.releases.update firebaserules.rulesets.create firebaserules.rulesets.get)
          fi
          required=$(printf '%s\n' "${permissions[@]}" | jq -R . | jq -s .)
          granted=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --json "{\"permissions\":$required}" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${FIREBASE_PROJECT}:testIamPermissions")
          missing=$(jq -r --argjson required "$required" \
            '($required - (.permissions // []))[]' <<<"$granted")
          if [[ -n "$missing" ]]; then
            echo "::error::Missing project IAM permissions for selected targets"
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "Firebase CLI authenticated. Verified permissions: $required" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified permissions: $required"

      - name: Verify the configured Firestore database using Firebase CLI
        if: steps.plan.outputs.firestore_rules == 'true'
        run: |
          database=$(jq -er '.firestore | if type == "array" and length == 1 then .[0].database else empty end' firebase.json)
          npx --no-install firebase firestore:databases:get "$database" --project "$FIREBASE_PROJECT" --non-interactive
          echo "Firebase CLI verified Firestore database: $database"

      - name: Publish Firestore rules
        if: inputs.deploy && steps.plan.outputs.firestore_rules == 'true'
        run: npx --no-install firebase deploy --project "$FIREBASE_PROJECT" --config firebase.json --only firestore:rules --non-interactive

      - name: Publish exhibition Hosting
        if: inputs.deploy && steps.plan.outputs.exhibition == 'true'
        run: npx --no-install firebase deploy --project "$FIREBASE_PROJECT" --config firebase.exhibition.json --only hosting:avalon-exhibition --non-interactive --message "$GITHUB_SHA"

      - name: Publish manager Hosting
        if: inputs.deploy && steps.plan.outputs.manager == 'true'
        run: npx --no-install firebase deploy --project "$FIREBASE_PROJECT" --config firebase.json --only hosting:avalondgu-site --non-interactive --message "$GITHUB_SHA"

      - name: Publish exhibition admin Hosting
        if: inputs.deploy && steps.plan.outputs.exhibition_admin == 'true'
        run: npx --no-install firebase deploy --project "$FIREBASE_PROJECT" --config firebase.exhibition.json --only hosting:avalon-exhibition-admin --non-interactive --message "$GITHUB_SHA"
